<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40">
  <!-- the site header's drawing, 40 px tall: one unit is one CSS pixel. The tip never narrower than 2 px (a needle point
       faded to a gradient at 1x), the shaft 2 px, the rim 1 px, a 1 px gap between the bar and the drape (a navy strip read as a
       stray rule), the ring's stroke 1.5 px with 2 px between it and the panels; sharp at 1x, smooth at 2x and 3x; also the exe's
       48 px entry, drawn 1:1 in the middle of its square (AH-121) -->
  <g data-part="spear" fill="#997D3A">
