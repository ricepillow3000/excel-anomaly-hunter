    <rect x="14" y="13" width="4" height="2"/>
  </g>
  <g data-part="banner"><path d="M4.5 20.5 H27.5 V37.6 L16 39.5 L4.5 37.6 Z" fill="#0C1938" stroke="#997D3A" stroke-linejoin="miter"/></g>
