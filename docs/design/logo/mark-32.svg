<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 3.5 72 72">
  <!-- the small drawing (48 px and under: icons, favicons, the headers): the large drawing's shapes with no hairlines,
       a bolder rim and emblem so they read, framed tight to fill its square; smooth vector, never a pixel grid (AH-103) -->
  <g transform="translate(40 40) scale(.97) translate(-40 -40)">
  <g fill="#997D3A">
    <!-- pole, then the finial: blade and curled wings, measured from John's reference, each one shape mirrored on x = 40 -->
    <rect x="38.5" y="25" width="3" height="19"/>
    <path d="M40 4.5 C39.9 13 38.9 20.5 36.6 24.1 L38.4 25.3 H41.6 L43.4 24.1 C41.1 20.5 40.1 13 40 4.5 Z"/>
    <path d="M40 26.9 C38 25.9 35 25.6 33.2 26.6 C31.7 27.4 31.4 29.8 32.5 32.3 C32.6 30.6 33.1 29.5 34.1 29.1 C36 28.5 38.3 28.9 40 29.5 C41.7 28.9 44 28.5 45.9 29.1 C46.9 29.5 47.4 30.6 47.5 32.3 C48.6 29.8 48.3 27.4 46.8 26.6 C45 25.6 42 25.9 40 26.9 Z"/>
    <rect x="38.4" y="25" width="3.2" height="1.6"/>
    <!-- collar -->
    <rect x="37.4" y="35.6" width="5.2" height="4.4"/>
  </g>
  <!-- banner: navy, gold rim, shallow V hem -->
  <path d="M19.5 46 H60.5 V71.5 L40 75 L19.5 71.5 Z" fill="#0C1938" stroke="#997D3A" stroke-width="2" stroke-linejoin="miter"/>
  <g fill="#997D3A">
    <!-- the drape hanging from the bar, the bar, its two end caps and the knot where it meets the pole -->
    <path d="M18.9 45.5 H61.1 V46.8 Q40 57 18.9 46.8 Z"/>
    <rect x="17" y="43" width="46" height="4"/>
    <rect x="12" y="42.5" width="6.5" height="5"/><rect x="61.5" y="42.5" width="6.5" height="5"/>
    <rect x="37.8" y="42.8" width="4.4" height="4.4"/>
  </g>
  <!-- emblem (John's sketch): two panels leaning in, meeting at their inner top corners; a slashed ring above -->
  <g fill="#F7F5F0">
    <path d="M30.4 63.4 H40 L36 69 H26.4 Z"/>
    <path d="M49.6 63.4 H40 L44 69 H53.6 Z"/>
  </g>
  <circle cx="40" cy="58.7" r="2.7" fill="none" stroke="#F7F5F0" stroke-width="1.8"/>
  <path d="M35.75 62.05 L44.25 55.35" stroke="#F7F5F0" stroke-width="1.8" stroke-linecap="square"/>
  </g>
</svg>
