<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <!-- the left half of the finial, measured from the reference; the right half is this mirrored on x = 40 -->
    <path id="blade" d="M40 4.5 C39.9 13 38.9 20.5 36.6 24.1 L38.4 25.3 H40 Z"/>
    <path id="wing" d="M40 26.9 C38 25.9 35 25.6 33.2 26.6 C31.7 27.4 31.4 29.8 32.5 32.3 C32.6 30.6 33.1 29.5 34.1 29.1 C36 28.5 38.3 28.9 40 29.5 Z"/>
  </defs>
  <g transform="translate(40 40) scale(.97) translate(-40 -40)">
  <!-- pole -->
  <rect x="38.5" y="25" width="3" height="19" fill="#9C7A35"/><rect x="38.5" y="25" width="1.5" height="19" fill="#B8954A"/>
  <!-- finial: a bronze outline drawn once underneath, then lit left / body right halves on top -->
  <g fill="none" stroke="#5E4719" stroke-width=".9" stroke-linejoin="round">
    <use href="#blade"/><use href="#blade" transform="matrix(-1 0 0 1 80 0)"/>
    <use href="#wing"/><use href="#wing" transform="matrix(-1 0 0 1 80 0)"/>
  </g>
  <use href="#blade" fill="#B8954A"/><use href="#blade" fill="#9C7A35" transform="matrix(-1 0 0 1 80 0)"/>
  <use href="#wing" fill="#B8954A"/><use href="#wing" fill="#9C7A35" transform="matrix(-1 0 0 1 80 0)"/>
  <rect x="38.4" y="25" width="3.2" height="1.6" rx=".5" fill="#9C7A35" stroke="#5E4719" stroke-width=".45"/>
  <!-- ribbed collar -->
  <rect x="37.4" y="35.6" width="5.2" height="4.4" rx=".9" fill="#9C7A35" stroke="#5E4719" stroke-width=".45"/>
  <path d="M37.4 37.1h5.2M37.4 38.5h5.2" stroke="#5E4719" stroke-width=".45"/>
  <!-- banner: navy, gold rim, shallow V hem -->
  <path d="M19.5 46 H60.5 V71.5 L40 75 L19.5 71.5 Z" fill="#0C1938" stroke="#9C7A35" stroke-width="1.2" stroke-linejoin="miter"/>
  <!-- the drape: gold cloth hanging from the bar, two folds -->
  <path d="M18.9 45.5 H61.1 V46.8 Q40 57 18.9 46.8 Z" fill="#9C7A35" stroke="#5E4719" stroke-width=".45" stroke-linejoin="round"/>
  <path d="M22 47.3 Q40 54 58 47.3M25 47.1 Q40 51.4 55 47.1" fill="none" stroke="#5E4719" stroke-width=".45"/>
  <!-- crossbar with two-ring caps -->
  <rect x="17" y="43" width="46" height="4" rx="2" fill="#9C7A35" stroke="#5E4719" stroke-width=".45"/>
  <rect x="18" y="43.6" width="44" height="1.2" rx=".6" fill="#B8954A"/>
  <g fill="#9C7A35" stroke="#5E4719" stroke-width=".45"><rect x="12" y="42.5" width="6.5" height="5" rx="1.2"/><rect x="61.5" y="42.5" width="6.5" height="5" rx="1.2"/></g>
  <path d="M14.4 42.5v5M16.4 42.5v5M63.6 42.5v5M65.6 42.5v5" stroke="#5E4719" stroke-width=".45"/>
  <!-- the knot where the bar meets the pole -->
  <rect x="37.8" y="42.8" width="4.4" height="4.4" rx="1" fill="#9C7A35" stroke="#5E4719" stroke-width=".45"/>
  <path d="M38.7 43.7 L41.3 46.3 M41.3 43.7 L38.7 46.3" stroke="#5E4719" stroke-width=".45" stroke-linecap="round"/>
  <!-- emblem (John's sketch): two panels leaning in, meeting at their inner top corners; a slashed ring above,
       clear of the drape -->
  <g fill="#F4F1EA">
    <path d="M30.4 63.4 H40 L36 69 H26.4 Z"/>
    <path d="M49.6 63.4 H40 L44 69 H53.6 Z"/>
  </g>
  <circle cx="40" cy="58.7" r="2.7" fill="none" stroke="#F4F1EA" stroke-width="1.15"/>
  <path d="M35.75 62.05 L44.25 55.35" stroke="#F4F1EA" stroke-width="1.15" stroke-linecap="round"/>
  </g>
</svg>
