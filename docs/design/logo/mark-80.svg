    <rect x="37" y="42" width="6" height="6"/>
    <path d="M14.5 42 V48 M16.5 42 V48 M63.5 42 V48 M65.5 42 V48 M38 43 L42 47 M42 43 L38 47" fill="none" stroke="#0C1938"/>
