  </g>
  <path data-part="midrib" d="M40 11 L40.6 24 H39.4 Z" fill="#0C1938"/>
  <g data-part="banner"><path d="M19.5 46 H60.5 V71.6 L40 75.5 L19.5 71.6 Z" fill="#0C1938" stroke="#997D3A" stroke-linejoin="miter"/></g>
  <g data-part="drape">
    <path d="M19 46 H61 V48 Q40 61 19 48 Z" fill="#997D3A"/>
    <path d="M19 47.5 H61 M22 48.9 Q40 56.7 58 48.9 M27 48.5 Q40 52.5 53 48.5" fill="none" stroke="#0C1938"/>
  </g>
  <g data-part="bar" fill="#997D3A">
