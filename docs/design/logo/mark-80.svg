<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- the large drawing, for 80 px and over (the download's logo at 240 and 320 px, the ribbon's 80, the exe's 256): one unit is one
       pixel at 80, every straight edge on a whole unit, so it is sharp at 80 and at 3x and 4x. Flat site gold, navy and paper, square ends, no
       outline. Its details are solid navy lines one unit wide (never a see-through hairline: at 55% on gold they read grey,
       AH-121): the blade's midrib (one navy wedge on the axis, its own part so the spear still fills in one gold), a band where the blade meets the pole, each wing's inner curl, the collar's two bands, the end
       caps' bands, the X lashing the bar to the pole, the line between the bar and the drape and the drape's two folds. Pole, collar and lashing share one centre and the collar and lashing one width, so no seam -->
  <g data-part="spear" fill="#997D3A">
    <path d="M40 4 C39.9 12.5 38.8 20 36.5 23.5 L38 25 H42 L43.5 23.5 C41.2 20 40.1 12.5 40 4 Z"/>
    <rect x="38" y="24" width="4" height="20"/>
