# Cloudflare Worker config for the AI relay. Deploy from this folder: npx wrangler@4.151.1 deploy
# Secrets (never in this file or the repo): npx wrangler@4.151.1 secret put GEMINI_KEY   and   npx wrangler@4.151.1 secret put TOKENS
# wrangler is pinned to a release two weeks old or more: a bare `npx wrangler` runs whatever was published last, while it
# holds the Gemini key and the invite list (AH-87). To move it, change every `wrangler@` here and in new-invite.mjs
name = "anomaly-hunter-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"] # the free plan's Durable Objects are SQLite-backed

# Set both from the REAL free quota: Google Cloud Console > IAM & Admin > Quotas, filter "Generative Language API",
# "requests per day" for the model in worker.js. Google counts per PROJECT, so give the relay its own project and key
# (then John's own AI help never competes with it). A word check spends 1 call per batch (a 30x50 sheet = 6 calls).
# Google's own limit is the real backstop: past it, users see "used up for today" / "busy, try in a minute".
# Relay project rules: NO billing account linked (so a leaked key can never cost money); GEMINI_KEY restricted
# to the Generative Language API. Rotate a leaked key: Cloud Console > Credentials > new key, same restriction;
# npx wrangler@4.151.1 secret put GEMINI_KEY (deploys at once); THEN delete the old key (re-uploading alone leaves it working).

# AH-158: a flood from one network (or one invite) is refused for the minute before the counter and Google: Cloudflare's
# Workers Rate Limiting, free, keyed in worker.js by the network's keyed hash (never the IP) or the invite's name. 15 a
# minute = a network's whole day: a word check (about 6 calls in a row) or several PCs behind one office router never
# meet it, and Ask AI is one call at a time per PC. Its count is Cloudflare's, per location, and only roughly exact;
# the daily caps stay the exact ones. period may only be 10 or 60. namespace_id: any number unique to this account
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

# Keep the promise in worker.js: no request or answer is stored (saved Workers logs are on by default). Live
# debugging still works with: npx wrangler@4.151.1 tail
[observability]
enabled = false

[vars]
DAILY_PER_INVITE = "10" # AI calls per invite code per day (one word check can take ~6)
DAILY_TOTAL = "20"      # for everyone together: John's project, gemini-3.8-flash free tier = 20 requests/day (2026-10-12)
# AH-145: the model, then backups tried at once when its day is used up or it is overloaded (each has its own free
# quota; each backup call counts against DAILY_TOTAL). Backups only with backend/bench/ai_eval.py --model numbers
MODELS = "gemini-3.8-flash"
# AH-151: the public tier (a request with no invite code), so every user has AI help with no key. Its own model and
# caps, counted apart from the invites': Google's free tier gives gemini-3.5-flash-lite about 500 requests a day per
# project (gemini-3.8-flash about 20), and 400 leaves room for the invites' backup calls. A network is counted under
# a keyed hash of the day and its IP, never the IP. PUBLIC_DAILY_TOTAL = "0" switches the public tier off
PUBLIC_DAILY_PER_NETWORK = "15" # AI calls per network (one IP address) per day
PUBLIC_DAILY_TOTAL = "400"      # for every public user together per day
# AH-158: one IPv6 /48 (65,536 networks, what a cheap VPS hands out) may use 3 networks' worth a day, beside each /64's 15
PUBLIC_DAILY_PER_48 = "45"
PUBLIC_MODELS = "gemini-3.5-flash-lite"
