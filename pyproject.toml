[project]
name = "anomaly_hunter"
version = "0.1.0"
description = "CLI engine that scans CSV/Excel files for anomalies and writes an annotated report.xlsx"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "pyod",
    "openpyxl",
    "flask",
    "anthropic",
]

[project.scripts]
anomaly-hunter = "anomaly_hunter.cli:main"
anomaly-hunter-server = "anomaly_hunter.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anomaly_hunter*"]
