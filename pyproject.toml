[project]
name = "anomaly_hunter"
version = "0.1.0"
description = "CLI engine that scans CSV/Excel files for anomalies and writes an annotated report.xlsx"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# pinned = known-good together on Python 3.14. No pyod (2026-10-19): its numba, llvmlite, matplotlib and scikit-learn
# made the exe 146 MB for one score, now detectors._ecod.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",  # fairness chi-square, ECOD's skew
    "openpyxl==3.1.5",
    "flask==3.1.3",
    "anthropic==1.11.0",
    "cryptography==50.0.2",
]

[project.scripts]
anomaly-hunter = "anomaly_hunter.cli:main"
anomaly-hunter-server = "anomaly_hunter.server:main"

[project.optional-dependencies]
dev = ["pytest", "schemathesis==4.28.0", "ruff==0.17.0", "pip-audit==2.10.1", "pyyaml"]  # fuzzing (test_fuzz_api.py), security lint + dependency audit + workflow parse (tools/check.py, CI)
exe = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8", "pillow==13.0.0"]  # the one-file app (build-exe.yml)

[build-system]
requires = ["setuptools==84.0.0"]  # exact, like constraints.txt: the build tool ships nothing, but runs in CI
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["anomaly_hunter*"]

[tool.setuptools.package-data]
anomaly_hunter = ["ai/bias_rules.json", "engine/person_names.txt"]  # the measured bias rules (tools/bias_sources.py) and the common names (tools/person_names.py); the exe gets them from the spec
