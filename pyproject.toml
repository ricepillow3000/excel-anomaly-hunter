[project]
name = "anomaly_hunter"
version = "0.1.0"
description = "Arcas: an Excel add-in whose local engine flags wrong cells in a sheet and suggests fixes"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# pinned = known-good together on Python 3.14. No pyod (2026-10-19): its numba, llvmlite, matplotlib and scikit-learn
# made the exe 146 MB for one score, now detectors._ecod.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scipy==1.18.1",  # fairness chi-square, ECOD's skew
    "openpyxl==3.1.5",
    "flask==3.1.3",
    "anthropic==1.11.0",
    "cryptography==50.0.2",
    # imported by the app itself (ai/client.py, server.py), so declared here, never only through anthropic or flask
    "pydantic==2.14.1",
    "werkzeug==3.1.9",
]

[project.scripts]
arcas = "anomaly_hunter.cli:main"
anomaly-hunter = "anomaly_hunter.cli:main"  # the name before AH-101: scripts written for it keep working
anomaly-hunter-server = "anomaly_hunter.server:main"

[project.optional-dependencies]
dev = ["pytest", "schemathesis==4.28.0", "ruff==0.17.0", "pip-audit==2.10.1", "pyyaml"]  # fuzzing (test_fuzz_api.py), security lint + dependency audit + workflow parse (tools/check.py, CI)
# no Pillow (AH-87): nothing imports it, and PyInstaller needs it only to convert an icon that is not a ready .ico
exe = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.8"]  # the one-file app (build-exe.yml)

[build-system]
requires = ["setuptools==84.1.0"]  # exact, like constraints.txt: the build tool ships nothing, but runs in CI
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["anomaly_hunter*"]

[tool.setuptools.package-data]
anomaly_hunter = ["ai/bias_rules.json"]  # the measured bias rules (tools/bias_sources.py); the exe gets them from the spec
