[project]
name = "anomaly_hunter"
version = "0.1.0"
description = "CLI engine that scans CSV/Excel files for anomalies and writes an annotated report.xlsx"
requires-python = ">=3.14"
# pinned = known-good together on Python 3.14 (numba is tied tightly to the Python version)
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyod==3.6.6",
    "numba==0.68.0",
    "scikit-learn==1.9.0",  # pulled in by pyod; Windows Smart App Control blocks a DLL in 1.9.1 (2026-10-11)
    "openpyxl==3.1.5",
    "flask==3.1.3",
    "anthropic==1.11.0",
    "cryptography==50.0.2",
]

[project.scripts]
anomaly-hunter = "anomaly_hunter.cli:main"
anomaly-hunter-server = "anomaly_hunter.server:main"

[project.optional-dependencies]
dev = ["pytest", "schemathesis==4.28.0", "ruff==0.17.0", "pip-audit==2.10.1", "pyyaml"]  # fuzzing (test_fuzz_api.py), security lint + dependency audit + workflow parse (tools/check.py, CI)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["anomaly_hunter*"]
