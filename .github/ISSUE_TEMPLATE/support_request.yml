name: Support request
description: Ask a question or report a problem. Public, needs a free GitHub account.
title: "[Support]: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything you post here is public.** GitHub keeps edit history, so deleting text later does not remove it.
        - Never paste your AI key or invite code. If you did: delete the key at https://aistudio.google.com/apikey now (editing the issue is not enough), or ask John for a new invite.
        - Never paste real customer data, account numbers or screenshots of real data. Use made-up values.
        - John will never ask for your key, invite code, password or file.
  - type: dropdown
    id: category
    attributes:
      label: What is this about?
      options:
        - Something isn't working
        - Question about a result or a flagged value
        - Feature idea
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version
      description: Copy the "Engine ..." line at the bottom of the Anomaly Hunter pane.
  - type: textarea
    id: details
    attributes:
      label: What happened, and what did you expect?
      description: The steps you took, what you expected, and what you saw. Made-up values only.
      placeholder: "When I clicked Find problems in this sheet, ..."
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: This contains no AI key, no invite code and no real or private data.
          required: true
