# Attack the LIVE AI relay from outside (the dev sandbox can't reach workers.dev): a dozen stranger requests - no
# invite code, path/method/size/CORS tricks - each must be refused before the invite check, so none reaches Google
# or counts against the daily caps. Runs when the relay changes, every day, and from the "Run workflow" button.
# Then one real call with no invite through the public tier, every run (AH-162): refusals alone never showed a revoked
# Gemini key or a retired model. It needs no secret and takes one of the public tier's daily calls. The invite canary
# (AH-108) stays optional: with the secret RELAY_CANARY_INVITE (an invite named canary) it makes one more call, taking
# one of the invites' shared daily calls; without it, or on a fork's pull request, it is left out with a note.
# The same daily run checks the public website and the Arcas.exe download (AH-124): a broken Pages deploy or a release
# with no exe used to wait for a user to say so. HEAD only (the exe is not downloaded), redirects followed to GitHub's
# file host, each a 2xx or the run fails, a hung host cut off at 20 s and tried once more.
name: Relay live probe

on:
  push:
    paths: ["relay/**", ".github/workflows/relay-live.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/relay-live.yml"]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          sparse-checkout: relay
      - name: Stranger requests to the live relay - all must be refused, and the canary's real call must work
        env:
          RELAY_CANARY_INVITE: ${{ secrets.RELAY_CANARY_INVITE }}
        run: node relay/live-probe.mjs

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: The public website and the Arcas.exe download each answer with a 2xx
        run: |
          set -euo pipefail
          for url in \
            https://ricepillow3000.github.io/excel-anomaly-hunter/ \
            https://ricepillow3000.github.io/excel-anomaly-hunter/privacy.html \
            https://ricepillow3000.github.io/excel-anomaly-hunter/support.html \
            https://ricepillow3000.github.io/excel-anomaly-hunter/terms.html \
            https://github.com/ricepillow3000/excel-anomaly-hunter/releases/latest/download/Arcas.exe
          do
            curl -fsSIL --max-time 20 --retry 1 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code} $url\n" "$url" \
              || { echo "::error::$url did not answer with a 2xx"; exit 1; }
          done
