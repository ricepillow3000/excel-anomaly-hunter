# API security tests on every push. Red X on GitHub = something below failed; click it to see which step.
name: API security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays: new vulnerabilities get found in old dependencies
  workflow_dispatch:      # "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e ".[dev]" -c constraints.txt  # every package pinned (tools/pinned.py), shared with tools/check.py

      - name: Engine API tests + fuzzing (other websites refused, key never leaks, no input crashes the engine)
        run: pytest -q backend/tests
      # its own environment via pipx: a scanning tool's dependencies are not the app's (pip-audit checks only those)
      - name: Semgrep code scan, front and back end (OWASP Top 10, XSS, Flask, secrets)
        run: >-
          pipx run --spec semgrep==1.178.0 semgrep scan --metrics=off --error --exclude e2e/all.sh
          --config p/default --config p/security-audit --config p/xss --config p/insecure-transport
          --config p/owasp-top-ten --config p/python --config p/flask --config p/javascript --config p/secrets
          backend frontend relay e2e tools
      - name: Relay abuse tests (invite codes, daily caps, key never echoed)
        run: node relay/test.mjs
      - name: Pane logic self-check
        run: node frontend/selfcheck.js
      # main's ruleset needs no approval: nothing else in CI stops a change that writes harmful fixes (2026-10-16)
      - name: Accuracy benches (no crash, no harmful fix, no new Medium+ false alarm)
        run: |
          python backend/bench/score.py .
          python backend/bench/score.py . --blind
      - name: Security lint (Bandit rules)
        run: ruff check --select S --ignore S101 backend/anomaly_hunter tools
      - name: Dependencies with known vulnerabilities
        run: pip-audit --skip-editable

  zap:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - run: pip install -e . -c constraints.txt

      - name: Start the real engine (throwaway cert, no keys)
        run: |
          python e2e/engine.py "$RUNNER_TEMP/engine" > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 60); do curl -skf https://127.0.0.1:5055/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/engine.log"; exit 1

      - name: OWASP ZAP scan of the running engine
        run: |
          mkdir -m 777 zap && cp .zap/rules.tsv zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://127.0.0.1:5055/taskpane.html -c rules.tsv -r report.html

      - name: OWASP ZAP active attack on every API route (weekly and "Run workflow"; slow, so not on every push)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cp backend/openapi.yaml zap/
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t openapi.yaml -f openapi -c rules.tsv -r api-report.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: zap-report
          path: zap/*.html
